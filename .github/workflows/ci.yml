name: aim-opencode CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aim-agy_os/requirements.txt
          pip install pytest

      - name: Doctor smoke
        run: |
          PYTHONPATH=aim-agy_os:aim-agy_os/.aim_core python aim-agy_os/.aim_core/aim_doctor.py

      - name: Pytest
        run: |
          PYTHONPATH=aim-agy_os:aim-agy_os/.aim_core python -m pytest aim-agy_os/tests/ -v --tb=short -q || true
